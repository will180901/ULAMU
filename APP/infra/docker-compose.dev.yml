# Environnement de développement local ULAMU (Référence Technique §4)
# Démarrage :  docker compose -f infra/docker-compose.dev.yml up -d
name: ulamu-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: ulamu-postgres
    environment:
      POSTGRES_USER: ulamu
      POSTGRES_PASSWORD: ulamu_dev_only   # dev local uniquement — jamais en production
      POSTGRES_DB: ulamu
    ports:
      - "5433:5432" # 5433 côté hôte : évite le conflit avec un PostgreSQL local éventuel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ulamu"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ulamu-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ulamu-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ulamu
      MINIO_ROOT_PASSWORD: ulamu_dev_only
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - miniodata:/data

  # Faux agrégateur Mobile Money (Chantier 2) :
  # un petit service local simulera MTN MoMo / Airtel Money (paiements, webhooks, remboursements)
  # pour développer M13 sans toucher au vrai argent. Ajouté au Chantier 2.

volumes:
  pgdata:
  miniodata:
