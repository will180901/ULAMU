<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { background: var(--bg-base); padding: 24px 28px; display: grid; grid-template-columns: 240px 1fr; gap: 28px; align-items: start; }
  .sidebar { background: var(--glass-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); padding: 12px; display: flex; flex-direction: column; gap: 4px; }
</style>
</head>
<body>
  <div id="sb"></div>
  <div id="tb"></div>
  <script type="text/babel">
    const { NavItem, Tabs } = window.ULAMUDesignSystem_d14300;
    function Sidebar() {
      const [active, setActive] = React.useState('consult');
      const items = [
        ['dashboard', 'Tableau de bord', null],
        ['consult', 'Consultations', '3'],
        ['patient', 'Patients', null],
        ['ordonnance', 'Ordonnances', null],
        ['credit-card', 'Gains', null],
      ];
      return (
        <div className="sidebar">
          {items.map(([icon, label, badge]) => (
            <NavItem key={icon} icon={icon} label={label} badge={badge}
              active={active === icon} onClick={() => setActive(icon)} />
          ))}
        </div>
      );
    }
    function TabsDemo() {
      const [v, setV] = React.useState('dossier');
      return (
        <Tabs value={v} onChange={setV} items={[
          { id: 'dossier', label: 'Dossier', icon: 'file-medical' },
          { id: 'ordo', label: 'Ordonnances', icon: 'ordonnance', badge: '2' },
          { id: 'examens', label: 'Examens', icon: 'activity' },
          { id: 'paiements', label: 'Paiements', icon: 'credit-card' },
        ]} />
      );
    }
    ReactDOM.createRoot(document.getElementById('sb')).render(<Sidebar />);
    ReactDOM.createRoot(document.getElementById('tb')).render(<TabsDemo />);
  </script>
</body>
</html>
