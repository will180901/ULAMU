<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { background: var(--bg-base); padding: 24px 28px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; align-items: start; }
  .controls { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Input, Select, Textarea, Checkbox, Radio, Switch, FormField } = window.ULAMUDesignSystem_d14300;
    function Demo() {
      const [chk, setChk] = React.useState(true);
      const [sw, setSw] = React.useState(true);
      const [r, setR] = React.useState('chat');
      return (
        <div className="grid">
          <div className="controls">
            <FormField label="Rechercher un médecin" htmlFor="q">
              <Input id="q" leftIcon="search" placeholder="Spécialité, nom…" defaultValue="Cardiologie" />
            </FormField>
            <FormField label="Arrondissement" htmlFor="a">
              <Select id="a" defaultValue="talangai">
                <option value="talangai">Talangaï</option>
                <option value="poto">Poto-Poto</option>
                <option value="bacongo">Bacongo</option>
              </Select>
            </FormField>
            <FormField label="Téléphone" htmlFor="t" error="Numéro Mobile Money invalide">
              <Input id="t" leftIcon="phone" invalid defaultValue="06 000" />
            </FormField>
          </div>
          <div className="controls">
            <FormField label="Motif de consultation" htmlFor="m">
              <Textarea id="m" rows={3} defaultValue="Douleurs thoraciques depuis 3 semaines." />
            </FormField>
            <Checkbox checked={chk} onChange={() => setChk(!chk)} label="J'accepte les conditions" />
            <Switch checked={sw} onChange={() => setSw(!sw)} label="Recevoir les rappels de médicaments" />
            <div style={{ display: 'flex', gap: 16 }}>
              <Radio name="mode" value="chat" checked={r === 'chat'} onChange={() => setR('chat')} label="Messagerie" />
              <Radio name="mode" value="vocal" checked={r === 'vocal'} onChange={() => setR('vocal')} label="Vocal" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
