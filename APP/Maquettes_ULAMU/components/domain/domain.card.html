  body { background: var(--bg-base); padding: 28px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-disabled); width: 100%; margin-bottom: -8px; }

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { SessionTimer, VerifiedBadge } = window.ULAMUDesignSystem_d14300;
    function Demo() {
      const [s, setS] = React.useState(880);
      React.useEffect(() => {
        const id = setInterval(() => setS(v => (v <= 0 ? 880 : v - 1)), 1000);
        return () => clearInterval(id);
      }, []);
      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 22, flexWrap: 'wrap' }}>
          <SessionTimer seconds={s} onExtend={() => setS(v => v + 300)} />
          <SessionTimer seconds={42} label="Session" />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            <VerifiedBadge label="Médecin vérifié" />
            <VerifiedBadge size="sm" label="Pharmacie vérifiée" />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
