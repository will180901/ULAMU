<!-- @startingPoint section="ULAMU — App patient" subtitle="App mobile patient : accueil, recherche, consultation chronométrée" viewport="412x760" -->
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ULAMU — App patient</title>
<script>
  try {
    const t = localStorage.getItem('ulamu-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="../../styles.css" />
<link rel="icon" href="../../assets/favicon.svg" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { height: 100%; }
  body { background: var(--bg-subtle); display: flex; align-items: center; justify-content: center; padding: 24px; min-height: 100vh; overflow: hidden; }
  body::before { display: none; }
  #stage { transform-origin: center; }
  .chips { scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .scr { display: flex; flex-direction: column; min-height: 100%; background: var(--bg-base); position: relative; }
  .pad { padding: 16px; }
  .uha { -webkit-tap-highlight-color: transparent; }
</style>
</head>
<body>
  <div id="stage"><div id="root"></div></div>
  <script type="text/babel" src="./android-frame.jsx"></script>
  <script type="text/babel" src="./screens.jsx"></script>
  <script type="text/babel" src="./screens2.jsx"></script>
  <script type="text/babel" src="./onboarding.jsx"></script>
  <script type="text/babel" src="./flow.jsx"></script>
  <script type="text/babel" src="./chat.jsx"></script>
  <script type="text/babel" src="./session.jsx"></script>
  <script type="text/babel" src="./tabs.jsx"></script>
  <script type="text/babel">
    const { PatientApp } = window;
    ReactDOM.createRoot(document.getElementById('root')).render(<PatientApp />);
    // fit-to-viewport scaling
    function fit() {
      const stage = document.getElementById('stage');
      const m = 32;
      const s = Math.min((window.innerWidth - m) / 412, (window.innerHeight - m) / 892, 1);
      stage.style.transform = `scale(${s})`;
    }
    window.addEventListener('resize', fit); setTimeout(fit, 60); fit();
  </script>
</body>
</html>
