<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ULAMU — Authentification mobile</title>
<script>
  try {
    var t = localStorage.getItem('ulamu-theme');
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="../../styles.css" />
<link rel="icon" href="../../assets/favicon.svg" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { height: 100%; }
  body { background: var(--bg-subtle); display: flex; align-items: center; justify-content: center; padding: 24px; min-height: 100vh; overflow: hidden; }
  #stage { transform-origin: center; }
  .uha { -webkit-tap-highlight-color: transparent; }
  .noscroll { scrollbar-width: none; }
  .noscroll::-webkit-scrollbar { display: none; }
  ::placeholder { color: var(--text-disabled); }
  @keyframes ulamu-fade-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes ulamu-pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
  <div id="stage"><div id="root"></div></div>
  <script src="./image-slot.js"></script>
  <script type="text/babel" src="./authm.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById('root')).render(<window.AuthMobileApp />);
    function fit() {
      const m = 32;
      const s = Math.min((window.innerWidth - m) / 412, (window.innerHeight - m) / 892, 1);
      document.getElementById('stage').style.transform = `scale(${s})`;
    }
    window.addEventListener('resize', fit); setTimeout(fit, 80); fit();
  </script>
</body>
</html>
