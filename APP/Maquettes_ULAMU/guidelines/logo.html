<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--bg-base); padding: 24px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .variant { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-radius: var(--radius-xl); border: 1px solid var(--border-subtle); }
  .mark { width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--accent-500); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mark.ghost { background: rgba(255,255,255,0.2); }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.3px; }
  .lbl { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--text-disabled); }
  svg { width: 19px; height: 19px; }
</style>
</head>
<body>
  <div class="variant" style="background:#111113">
    <span class="mark"><svg viewBox="0 0 16 16" fill="none"><path d="M8 2C5.8 2 4 3.8 4 6c0 1.4.7 2.6 1.8 3.3L5 12h6l-.8-2.7C11.3 8.6 12 7.4 12 6c0-2.2-1.8-4-4-4z" fill="#fff" fill-opacity=".92"/><rect x="5.5" y="12.5" width="5" height="1.5" rx=".75" fill="#fff" fill-opacity=".72"/></svg></span>
    <span class="name" style="color:#F4F4F5">ulamu</span><span class="lbl">sombre</span>
  </div>
  <div class="variant" style="background:#FFFFFF">
    <span class="mark"><svg viewBox="0 0 16 16" fill="none"><path d="M8 2C5.8 2 4 3.8 4 6c0 1.4.7 2.6 1.8 3.3L5 12h6l-.8-2.7C11.3 8.6 12 7.4 12 6c0-2.2-1.8-4-4-4z" fill="#fff" fill-opacity=".92"/><rect x="5.5" y="12.5" width="5" height="1.5" rx=".75" fill="#fff" fill-opacity=".72"/></svg></span>
    <span class="name" style="color:#111112">ulamu</span><span class="lbl" style="color:#A1A1AA">clair</span>
  </div>
  <div class="variant" style="background:#2756A6">
    <span class="mark ghost"><svg viewBox="0 0 16 16" fill="none"><path d="M8 2C5.8 2 4 3.8 4 6c0 1.4.7 2.6 1.8 3.3L5 12h6l-.8-2.7C11.3 8.6 12 7.4 12 6c0-2.2-1.8-4-4-4z" fill="#fff" fill-opacity=".95"/><rect x="5.5" y="12.5" width="5" height="1.5" rx=".75" fill="#fff" fill-opacity=".8"/></svg></span>
    <span class="name" style="color:#fff">ulamu</span><span class="lbl" style="color:rgba(255,255,255,0.6)">accent</span>
  </div>
  <div class="variant" style="background:var(--bg-muted)">
    <span class="mark"><svg viewBox="0 0 16 16" fill="none"><path d="M8 2C5.8 2 4 3.8 4 6c0 1.4.7 2.6 1.8 3.3L5 12h6l-.8-2.7C11.3 8.6 12 7.4 12 6c0-2.2-1.8-4-4-4z" fill="#fff" fill-opacity=".92"/><rect x="5.5" y="12.5" width="5" height="1.5" rx=".75" fill="#fff" fill-opacity=".72"/></svg></span>
    <span class="name" style="color:var(--text-primary)">ulamu</span><span class="lbl">muted</span>
  </div>
</body>
</html>
