<!-- @dsCard group="Spacing" viewport="700x200" name="Échelle d'espacement" subtitle="Base 4px · paliers nommés --sp-1 → --sp-16" -->
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--bg-base); padding: 24px 28px; display: flex; flex-direction: column; gap: 7px; }
  .row { display: grid; grid-template-columns: 64px 44px 1fr; align-items: center; gap: 14px; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-accent); }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); }
  .bar { height: 14px; background: var(--accent-500); border-radius: var(--radius-sm); }
</style>
</head>
<body>
  <div class="row"><span class="tok">--sp-1</span><span class="px">4</span><div class="bar" style="width:4px"></div></div>
  <div class="row"><span class="tok">--sp-2</span><span class="px">8</span><div class="bar" style="width:8px"></div></div>
  <div class="row"><span class="tok">--sp-3</span><span class="px">12</span><div class="bar" style="width:12px"></div></div>
  <div class="row"><span class="tok">--sp-4</span><span class="px">16</span><div class="bar" style="width:16px"></div></div>
  <div class="row"><span class="tok">--sp-6</span><span class="px">24</span><div class="bar" style="width:24px"></div></div>
  <div class="row"><span class="tok">--sp-8</span><span class="px">32</span><div class="bar" style="width:32px"></div></div>
  <div class="row"><span class="tok">--sp-12</span><span class="px">48</span><div class="bar" style="width:48px"></div></div>
  <div class="row"><span class="tok">--sp-16</span><span class="px">64</span><div class="bar" style="width:64px"></div></div>
</body>
</html>
