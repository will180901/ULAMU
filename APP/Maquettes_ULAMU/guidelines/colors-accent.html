<!-- @dsCard group="Colors" viewport="700x150" name="Accent — Bleu Cobalt" subtitle="Échelle 50→900 · base 500 #2756A6" -->
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--bg-base); padding: 24px 28px; }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .chip { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-subtle); }
  .sw { height: 56px; }
  .meta { padding: 5px 6px; background: var(--bg-elevated); }
  .step { font-family: var(--font-mono); font-size: 9px; font-weight: 600; color: var(--text-tertiary); display: block; }
  .hex { font-family: var(--font-mono); font-size: 8px; color: var(--text-disabled); display: block; }
  .base { outline: 2px solid var(--accent-300); outline-offset: 1px; }
</style>
</head>
<body>
  <div class="row">
    <div class="chip"><div class="sw" style="background:#EBF0FA"></div><div class="meta"><span class="step">50</span><span class="hex">EBF0FA</span></div></div>
    <div class="chip"><div class="sw" style="background:#C6D4F2"></div><div class="meta"><span class="step">100</span><span class="hex">C6D4F2</span></div></div>
    <div class="chip"><div class="sw" style="background:#9DB5E8"></div><div class="meta"><span class="step">200</span><span class="hex">9DB5E8</span></div></div>
    <div class="chip"><div class="sw" style="background:#6F92DA"></div><div class="meta"><span class="step">300</span><span class="hex">6F92DA</span></div></div>
    <div class="chip"><div class="sw" style="background:#4B75CD"></div><div class="meta"><span class="step">400</span><span class="hex">4B75CD</span></div></div>
    <div class="chip base"><div class="sw" style="background:#2756A6"></div><div class="meta"><span class="step">500</span><span class="hex">2756A6</span></div></div>
    <div class="chip"><div class="sw" style="background:#1F479A"></div><div class="meta"><span class="step">600</span><span class="hex">1F479A</span></div></div>
    <div class="chip"><div class="sw" style="background:#163588"></div><div class="meta"><span class="step">700</span><span class="hex">163588</span></div></div>
    <div class="chip"><div class="sw" style="background:#0E2568"></div><div class="meta"><span class="step">800</span><span class="hex">0E2568</span></div></div>
    <div class="chip"><div class="sw" style="background:#091849"></div><div class="meta"><span class="step">900</span><span class="hex">091849</span></div></div>
  </div>
</body>
</html>
