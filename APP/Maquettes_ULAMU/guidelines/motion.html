<!-- @dsCard group="Spacing" viewport="700x160" name="Mouvement — Durées & Easing" subtitle="base 200ms · ease-spring pour les retours tactiles" -->
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--bg-base); padding: 24px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .col-lbl { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-disabled); margin-bottom: 10px; }
  .dur { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
  .dur .n { font-family: var(--font-mono); font-size: 11px; color: var(--text-accent); width: 96px; }
  .dur .v { font-family: var(--font-mono); font-size: 11px; color: var(--text-tertiary); width: 48px; }
  .dur .track { flex: 1; height: 6px; background: var(--bg-muted); border-radius: 3px; overflow: hidden; }
  .dur .fill { height: 100%; background: var(--accent-500); border-radius: 3px; }
  .ease { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); padding: 5px 0; }
  .ease b { color: var(--text-accent); font-weight: 600; }
</style>
</head>
<body>
  <div>
    <div class="col-lbl">Durées</div>
    <div class="dur"><span class="n">--dur-fast</span><span class="v">150ms</span><div class="track"><div class="fill" style="width:35%"></div></div></div>
    <div class="dur"><span class="n">--dur-base</span><span class="v">200ms</span><div class="track"><div class="fill" style="width:50%"></div></div></div>
    <div class="dur"><span class="n">--dur-moderate</span><span class="v">250ms</span><div class="track"><div class="fill" style="width:65%"></div></div></div>
    <div class="dur"><span class="n">--dur-slow</span><span class="v">350ms</span><div class="track"><div class="fill" style="width:88%"></div></div></div>
  </div>
  <div>
    <div class="col-lbl">Easing</div>
    <div class="ease"><b>--ease-out</b> — entrées</div>
    <div class="ease"><b>--ease-in</b> — sorties</div>
    <div class="ease"><b>--ease-spring</b> — cubic-bezier(.34, 1.56, .64, 1)</div>
    <div class="ease" style="color:var(--text-tertiary)">press : scale(0.97) · 80ms</div>
  </div>
</body>
</html>
