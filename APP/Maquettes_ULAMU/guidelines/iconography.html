<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
<style>
  body { background: var(--bg-base); padding: 22px 26px; }
  #root { display: grid; grid-template-columns: repeat(11, 1fr); gap: 8px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px; background: var(--bg-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); color: var(--text-secondary); }
  .cn { font-family: var(--font-mono); font-size: 8px; color: var(--text-disabled); text-align: center; line-height: 1.2; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Icon } = window.ULAMUDesignSystem_d14300;
    const names = ['home','dashboard','search','settings','bell','stethoscope','patient','file-medical','ordonnance','rendez-vous','heart-pulse','pill','activity','hospital','shield-check','message','mic','credit-card','qr-code','map-pin','wifi-off','lock','check-circle','alert-triangle'];
    ReactDOM.createRoot(document.getElementById('root')).render(
      <>{names.map(n => (
        <div className="cell" key={n}>
          <Icon name={n} size={20} />
          <span className="cn">{n}</span>
        </div>
      ))}</>
    );
  </script>
</body>
</html>
