<!-- @dsCard group="Colors" viewport="700x180" name="Surfaces & texte (sombre)" subtitle="Fonds élevés + hiérarchie de texte · thème par défaut" -->
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--bg-base); padding: 24px 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-disabled); margin-bottom: 4px; }
  .swatch { display: flex; align-items: center; gap: 10px; }
  .box { width: 34px; height: 22px; border-radius: var(--radius-sm); border: 1px solid var(--border-default); flex-shrink: 0; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
  .txt { display: flex; flex-direction: column; gap: 2px; }
</style>
</head>
<body>
  <div class="group">
    <div class="lbl">Fonds</div>
    <div class="swatch"><span class="box" style="background:#111113"></span><span class="name">--bg-base</span></div>
    <div class="swatch"><span class="box" style="background:#18181B"></span><span class="name">--bg-subtle</span></div>
    <div class="swatch"><span class="box" style="background:#222226"></span><span class="name">--bg-muted</span></div>
    <div class="swatch"><span class="box" style="background:#2A2A2F"></span><span class="name">--bg-elevated</span></div>
  </div>
  <div class="group">
    <div class="lbl">Texte</div>
    <div class="txt"><span style="font-size:15px;color:var(--text-primary)">Texte primaire — F4F4F5</span>
    <span style="font-size:15px;color:var(--text-secondary)">Texte secondaire — A1A1AA</span>
    <span style="font-size:15px;color:var(--text-tertiary)">Texte tertiaire — 71717A</span>
    <span style="font-size:15px;color:var(--text-disabled)">Texte désactivé — 52525B</span>
    <span style="font-size:15px;color:var(--text-accent)">Texte accent — 6F92DA</span></div>
  </div>
</body>
</html>
