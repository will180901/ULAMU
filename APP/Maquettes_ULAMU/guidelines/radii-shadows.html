<!-- @dsCard group="Spacing" viewport="700x150" name="Rayons & Ombres" subtitle="radius sm→xl · élévation sm→xl" -->
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--bg-base); padding: 24px 28px; display: flex; flex-direction: column; gap: 22px; }
  .strip { display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 7px; }
  .box { width: 60px; height: 44px; background: var(--bg-elevated); border: 1px solid var(--border-subtle); }
  .lbl { font-family: var(--font-mono); font-size: 10px; color: var(--text-tertiary); }
</style>
</head>
<body>
  <div class="strip">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="lbl">sm · 4</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><span class="lbl">md · 6</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="lbl">lg · 10</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="lbl">xl · 14</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-full);width:44px"></div><span class="lbl">full</span></div>
    <div style="width:1px;height:44px;background:var(--border-default);margin:0 4px"></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-sm)"></div><span class="lbl">shadow-sm</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-md)"></div><span class="lbl">shadow-md</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-lg)"></div><span class="lbl">shadow-lg</span></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md);box-shadow:var(--shadow-xl)"></div><span class="lbl">shadow-xl</span></div>
  </div>
</body>
</html>
