<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--bg-base); padding: 24px 28px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .card { border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-subtle); }
  .head { padding: 14px 14px 12px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .label { font-family: var(--font-display); font-size: 13px; font-weight: 700; }
  .pv { margin: 0 14px 14px; padding: 8px 10px; border-radius: var(--radius-md); font-size: 11px; font-weight: 500; }
</style>
</head>
<body>
  <div class="card"><div class="head"><span class="dot" style="background:var(--success-dot)"></span><span class="label" style="color:var(--success-text)">Succès</span></div><div class="pv" style="background:var(--success-bg);color:var(--success-text);border:1px solid var(--success-border)">Paiement confirmé</div></div>
  <div class="card"><div class="head"><span class="dot" style="background:var(--warning-dot)"></span><span class="label" style="color:var(--warning-text)">Alerte</span></div><div class="pv" style="background:var(--warning-bg);color:var(--warning-text);border:1px solid var(--warning-border)">Vous êtes hors ligne</div></div>
  <div class="card"><div class="head"><span class="dot" style="background:var(--error-dot)"></span><span class="label" style="color:var(--error-text)">Erreur</span></div><div class="pv" style="background:var(--error-bg);color:var(--error-text);border:1px solid var(--error-border)">Allergie détectée</div></div>
  <div class="card"><div class="head"><span class="dot" style="background:var(--info-dot)"></span><span class="label" style="color:var(--info-text)">Info</span></div><div class="pv" style="background:var(--info-bg);color:var(--info-text);border:1px solid var(--info-border)">Réservé 24 h</div></div>
</body>
</html>
