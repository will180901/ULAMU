<!-- @dsCard group="Type" viewport="700x180" name="Familles & Mono" subtitle="Display / Body / Mono · JetBrains Mono pour codes" -->
<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { background: var(--bg-base); padding: 24px 28px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .fam { background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 16px 18px; }
  .tag { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-accent); display: block; margin-bottom: 10px; }
  .spec { font-family: var(--font-mono); font-size: 10px; color: var(--text-disabled); margin-top: 8px; }
</style>
</head>
<body>
  <div class="fam"><span class="tag">Display</span><div style="font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-0.5px;color:var(--text-primary)">Aa</div><div class="spec">Plus Jakarta Sans<br>300 → 800</div></div>
  <div class="fam"><span class="tag">Body</span><div style="font-family:var(--font-body);font-size:26px;font-weight:500;color:var(--text-primary)">Aa</div><div class="spec">Inter<br>300 → 600</div></div>
  <div class="fam"><span class="tag">Mono</span><div style="font-family:var(--font-mono);font-size:22px;font-weight:500;color:var(--text-primary)">ORD-412</div><div class="spec">JetBrains Mono<br>codes, IDs, chiffres</div></div>
</body>
</html>
