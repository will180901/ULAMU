# Blueprint d'hébergement ULAMU — lu automatiquement par Render (https://render.com).
# Déploie l'API NestJS (apps/api) en service web. La base de données est gérée séparément (Neon).
#
# À la création du Blueprint sur Render, une SEULE variable est à renseigner à la main :
#   DATABASE_URL  (la "connection string" Neon, marquée sync:false ci-dessous = secret, non versionné)
services:
  - type: web
    name: ulamu-api
    runtime: node
    region: frankfurt          # même région que la base Neon (latence minimale)
    plan: free                 # gratuit (se met en veille après ~15 min d'inactivité, se réveille à la 1re requête)
    rootDir: APP/apps/api       # le serveur est autonome dans ce dossier
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm run start:prod   # applique les migrations puis démarre le serveur
    healthCheckPath: /health
    autoDeploy: true           # redéploie automatiquement à chaque "git push"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false            # ← à coller dans le tableau de bord Render (secret)
      - key: SECRETBOX_KEY
        sync: false            # ← à coller dans le tableau de bord Render (secret, 32 octets base64 : "openssl rand -base64 32")
                               # Chiffre au repos messages de session + médias + secrets TOTP (AES-256-GCM).
                               # Sans cette variable, une clé de repli FIXE et connue du code source est utilisée
                               # (dev uniquement) — le chiffrement ne protège alors plus rien en production.
      - key: MOMO_WEBHOOK_SECRET
        generateValue: true    # Render génère un secret aléatoire (le vrai paiement viendra plus tard)
      # ── Envoi des emails (codes OTP : inscription, mot de passe oublié, 2FA) ──
      # Brevo est la passerelle ACTIVE : elle livre à n'importe quel destinataire dès qu'un expéditeur
      # est vérifié, sans posséder de domaine. C'est ce qui débloque l'inscription réelle.
      - key: BREVO_API_KEY
        sync: false            # ← à coller dans le tableau de bord Render (secret, brevo.com → SMTP & API → clés API)
      - key: BREVO_FROM_EMAIL
        sync: false            # ← l'adresse VÉRIFIÉE dans Brevo (Senders & IP). Sans vérification, Brevo refuse l'envoi.
      - key: BREVO_FROM_NAME
        value: ULAMU
      - key: RESEND_API_KEY
        sync: false            # ← optionnel, conservé : Resend reprendra la main (il suffit de retirer BREVO_API_KEY)
                               # le jour où un domaine ULAMU sera vérifié. Sans domaine, Resend ne livre
                               # qu'à l'adresse du compte Resend — inutilisable pour de vrais utilisateurs.
      - key: OTP_ECHO
        value: "false"         # Le code de vérification n'est PLUS renvoyé dans la réponse de l'API.
                               # Le laisser à "true" en production exposait le mot de passe de n'importe
                               # quel compte (demande de code publique + réinitialisation par ce seul code).
                               # Le code refuse de toute façon l'écho quand NODE_ENV=production (garde-fou dur).
      # MODE VITRINE — **MOITIÉ RETIRÉE le 28/08/2026.**
      #
      # Il datait de l'époque où aucune interface web n'existait : personne ne pouvait confirmer une
      # poignée de main, donc le serveur le faisait à la place du soignant. Le web se reconstruit
      # désormais écran par écran et le porteur teste en direct — l'auto-confirmation ne simule plus
      # une absence, elle EMPÊCHE le test.
      #
      # ⚠️ `scheduleDevAutoConfirm` n'était pas un « soignant virtuel » : il usurpait l'identité du
      # VRAI médecin et confirmait à sa place en 3 s. Une demande traversait donc « en attente »,
      # « confirmée » et « payée » en sept secondes, sans qu'on puisse rien observer.
      #
      # RETIRÉ DU FICHIER : HANDSHAKE_AUTOCONFIRM_MS — c'est le médecin qui confirme, depuis C3
      # (EF-06-02).
      #
      # ⚠️ **MAIS RETIRER LA LIGNE ICI NE SUFFIT PAS.** Constaté le 28/08 : Render ne supprime pas
      # une variable déjà posée sur un service quand elle disparaît du blueprint — la synchronisation
      # ajoute et met à jour, elle n'efface pas. Le déploiement suivant a donc gardé la variable, et
      # les poignées de main ont continué de se confirmer toutes seules alors que le fichier disait
      # le contraire.
      #
      # Pour la retirer VRAIMENT : tableau de bord Render → service `ulamu-api` → onglet Environment
      # → supprimer la ligne → Save changes. Vaut pour toute variable qu'on croit avoir enlevée.
      #
      # ⚠️ **MOMO_AUTOCONFIRM_MS RESTE, et ce n'est pas un oubli.** La passerelle Mobile Money est une
      # implémentation de développement, en mémoire : aucun agrégateur réel n'est encore choisi
      # (ADR-09, ouvert). Sans elle, une demande de paiement reste en attente à jamais, aucune session
      # ne démarre, et le parcours de soin s'arrête net. À retirer le jour où un vrai agrégateur
      # répondra — pas avant.
      - key: MOMO_AUTOCONFIRM_MS
        value: "4000"          # le paiement Mobile Money se valide tout seul après 4 s (aucun argent réel)
      # RETIRÉ DU FICHIER le 01/09/2026 : ADMIN_REQUIRE_TOTP — RM-01-06 (TOTP obligatoire pour toute
      # action d'administration) est rétablie. Le code vaut "true" PAR DÉFAUT : l'absence de ligne
      # SUFFIT, et un oubli laisse donc le système fermé, jamais ouvert.
      #
      # Elle avait été posée à "false" le 20/08 après qu'un secret TOTP scellé en local se soit
      # révélé illisible par l'API déployée, enfermant le compte administrateur dehors. La cause est
      # corrigée depuis : le seed ne scelle plus aucun secret, le compte active son TOTP depuis
      # l'application, avec la clé du serveur qui le relira.
      #
      # ⚠️ Elle est retirée d'ICI et pas seulement du tableau de bord : si ce service est un
      # Blueprint, Render ré-applique ce fichier à chaque déploiement — la variable serait revenue
      # toute seule, et la 2FA serait retombée sans que personne ne le voie.
      - key: CORS_ORIGINS     # origines autorisées à appeler l'API depuis un navigateur (app web pro/structure/admin)
        value: "https://ulamu-web.onrender.com,http://localhost:5173"

  # App web pro/structure/admin — même principe que CMS-SARIS (site statique, déploiement auto à chaque push).
  - type: web
    name: ulamu-web
    runtime: static
    rootDir: APP/apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # SPA : react-router gère le routage côté client (BrowserRouter) — sans cette règle, une URL
      # comme /inscription tapée/rechargée directement renvoie 404 (le serveur cherche un fichier réel).
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ulamu-api.onrender.com
